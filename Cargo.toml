[package]
name = "trapy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Bowan Foryt <bowan@valstad.com>"]
description = "Python logging facade that emits real Rust `tracing` events with structured kwargs."
repository = "https://github.com/valstad-shipworks/trapy"
documentation = "https://docs.rs/trapy"
readme = "README.md"
keywords = ["tracing", "logging", "python", "pyo3", "subscriber"]
categories = ["development-tools::debugging", "api-bindings"]

[lib]
name = "trapy"
crate-type = ["cdylib", "rlib"]

[dependencies]
opentelemetry = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
opentelemetry_sdk = { version = "0.32", features = ["trace"], optional = true }
pyo3 = { version = "0.29" }
tracing = { version = "0.1.44", features = ["valuable"] }
tracing-catty = { version = "0.1.0", optional = true }
tracing-core = "0.1.36"
tracing-opentelemetry = { version = "0.33.0", optional = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json", "registry", "ansi", "std"], optional = true }
tracing-timing = { version = "0.7", default-features = false, features = ["layer"], optional = true }
tracing-tracy = { version = "0.11.4", optional = true }
valuable = "0.1.1"

[features]
# Enabled when trapy is built as a standalone Python extension (via
# maturin). Consumers that re-export trapy from another pyo3 cdylib (e.g.
# orchestra) must NOT enable this — their own crate already pulls in
# `pyo3/extension-module` once at the final cdylib level.
extension-module = ["pyo3/extension-module"]
# The whole subscriber backend: layer builders (`add_*` / `init_subscriber`),
# the per-category file router, and the capsule *owner* side. Cdylibs that
# only forward events into trapy at runtime via the capsule handshake (e.g.
# orchestra) must NOT enable this — they stay consumer-only and skip compiling
# every subscriber crate.
subscribers = [
    "dep:tracing-subscriber",
    "dep:tracing-catty",
    "dep:tracing-timing",
    "dep:tracing-tracy",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]
# Wheel ABI selectors. `abi3` targets the stable ABI from 3.10 up; `abi3t` is
# PEP 803's free-threaded stable ABI, 3.15 and up. Both pull in the backend
# because a standalone wheel is always the subscriber owner.
abi3 = ["subscribers", "pyo3/abi3-py310"]
abi3t = ["subscribers", "pyo3/abi3t-py315"]
